name: Build Mesa Turnip Driver

on:
  push:
    branches:
      - stable
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - stable
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Turnip Driver
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            ccache \
            ninja-build \
            patchelf \
            unzip \
            curl \
            flex \
            bison \
            zip \
            glslang-tools \
            pkg-config \
            python3 \
            python3-pip \
            python3-mako \
            python3-yaml
          pip3 install --upgrade --break-system-packages meson mako packaging pyyaml

      - name: Run Turnip Build Script
        run: |
          bash build-turnip.sh

      - name: Upload Driver Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Driver-Artifacts
          path: |
            turnip_workdir/Turnip-*.zip
            turnip_workdir/vulkan.turnip.so
            turnip_workdir/meson_log
            turnip_workdir/ninja_log
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            turnip_workdir/Turnip-*.zip
            turnip_workdir/vulkan.turnip.so
