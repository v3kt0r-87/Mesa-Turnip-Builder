name: Build Mesa Turnip Driver

on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - stable
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Turnip Driver
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            ccache \
            ninja-build \
            patchelf \
            unzip \
            curl \
            flex \
            bison \
            zip \
            glslang-tools \
            pkg-config \
            python3 \
            python3-pip \
            python3-mako \
            python3-yaml
          pip3 install --upgrade --break-system-packages meson mako packaging pyyaml

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-turnip-mesa
          restore-keys: |
            ${{ runner.os }}-turnip-

      - name: Extract Mesa Version
        id: get_version
        run: |
          VERSION=$(grep -E '^(mesa_ver|mesadir)=' build-turnip.sh | head -n1 | cut -d'"' -f2 | sed 's/mesa-mesa-//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Turnip Build Script
        run: |
          bash build-turnip.sh

      - name: Upload Driver Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Driver-Artifacts
          path: |
            turnip_workdir/Turnip-*.zip
            turnip_workdir/vulkan.turnip.so
            turnip_workdir/meson_log
            turnip_workdir/ninja_log
          if-no-files-found: warn

      - name: Extract Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sed '/^---/q' UPDATES.md | sed '$d' > release_notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: MESA-Turnip-${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          files: |
            turnip_workdir/Turnip-*.zip
            turnip_workdir/vulkan.turnip.so
